# SwiftFormat is the arbiter of formatting; SwiftLint only checks what it cannot fix.
included:
  - Packages/ScanCore/Sources
  - Packages/ScanCore/Tests
  - App
excluded:
  - .build
  - DerivedData

disabled_rules:
  - trailing_comma # SwiftFormat adds trailing commas in multiline literals.
  - opening_brace # SwiftFormat wraps long signatures with the brace on its own line.

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2 # allows x, y for geometry
  excluded: [id, x, y]

type_name:
  min_length: 2 # allows the conventional nested `ID`

todo:
  severity: warning

opt_in_rules:
  - force_unwrapping
  - missing_docs

force_try:
  severity: error

# Module boundaries from CLAUDE.md, enforced mechanically.
custom_rules:
  vision_only_in_ocr:
    name: "Vision outside OCR"
    regex: '^\s*(@preconcurrency\s+)?import\s+Vision\b'
    included: '(Packages/ScanCore/Sources/(?!OCR/)|App/)'
    message: "Only the OCR module imports Vision."
    severity: error
  no_ui_in_scancore:
    name: "UI import in ScanCore"
    regex: '^\s*(@preconcurrency\s+)?import\s+(SwiftUI|AppKit|UIKit)\b'
    included: 'Packages/ScanCore/Sources/'
    message: "ScanCore never imports SwiftUI, AppKit or UIKit."
    severity: error
  pdf_only_in_importing:
    name: "CGPDF outside Importing"
    regex: '\bCGPDF[A-Za-z]*\b'
    included: '(Packages/ScanCore/Sources/(?!Importing/)|App/)'
    message: "Only the Importing module reads PDFs."
    severity: error
  styles_depends_on_model_and_layout:
    name: "Styles import"
    regex: '^\s*(@preconcurrency\s+)?import\s+(?!(DocumentModel|LayoutAnalysis|Foundation|CoreGraphics)\b)\w+'
    included: 'Packages/ScanCore/Sources/Styles/'
    message: "Styles depends only on DocumentModel and LayoutAnalysis, so the app and pagescan share it."
    severity: error
